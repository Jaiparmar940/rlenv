[project]
name = "no-start-env-hud"
version = "0.1.0"
description = "HUD managed-environment packaging for no-start-env (Second Nature Labs)"
requires-python = ">=3.11,<3.13"
# The environment itself needs only pydantic, which arrives with hud (as does
# fastmcp). The nostart package is mirrored into vendor/ by deploy/hud/stage.py
# and put on sys.path by adapter_core — deliberately not re-declared as a
# dependency, so there is exactly one copy of the domain code in the repo.
dependencies = ["hud>=0.6.12,<0.7"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
